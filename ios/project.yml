# The Xcode project is made from this file by XcodeGen (`ios/generate.sh`); Halden.xcodeproj is
# committed too, so it can simply be opened in Xcode.
name: Halden
options:
  bundleIdPrefix: com.lucas.halden
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HaldenKit:
    path: HaldenKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Halden:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HaldenKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Halden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Halden takes your photos with the camera.
        NSLocationWhenInUseUsageDescription: Halden notes where a photo was taken, how precisely, and which way the camera pointed.
        NSLocalNetworkUsageDescription: Halden connects to your own Halden server in your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.halden.ios
        PRODUCT_NAME: Halden
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  HaldenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Halden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.halden.ios.uitests
        TEST_TARGET_NAME: Halden
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Halden:
    build:
      targets:
        Halden: all
        HaldenUITests: [test]
    test:
      targets:
        - HaldenUITests
