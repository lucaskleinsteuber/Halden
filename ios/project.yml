# The Xcode project is made from this file by XcodeGen (`ios/generate.sh`); Halden.xcodeproj is
# committed too, so it can simply be opened in Xcode.
name: Halden
options:
  bundleIdPrefix: com.lucas.halden
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HaldenKit:
    path: HaldenKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Halden:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["AppIcon.icon/**"]
      # The app icon from Icon Composer's format (made by Icon/make_icon.py): one file for Xcode.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: HaldenKit
      - package: HaldenKit
        product: HaldenWatchProtocol
      - target: HaldenWidgets
      - target: HaldenLockedCamera
      - target: HaldenWatch
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Halden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Halden takes your photos and videos with the camera.
        NSMicrophoneUsageDescription: Halden records the sound of your videos.
        NSLocationWhenInUseUsageDescription: Halden notes where a photo was taken, how precisely, and which way the camera pointed.
        NSPhotoLibraryUsageDescription: Halden backs up the photos and videos in Apple Photos to your own server.
        NSPhotoLibraryAddUsageDescription: Halden saves the photos and videos you take with it in Apple Photos too.
        NSLocalNetworkUsageDescription: Halden connects to your own Halden server in your home network.
        NSBonjourServices: [_halden._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [processing]
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers: [com.lucas.halden.ios.upload]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.halden.ios
        PRODUCT_NAME: Halden
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  # Live Activity for uploads and the camera control (Control Center, Lock Screen, Action button).
  HaldenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Halden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.halden.ios.widgets
        PRODUCT_NAME: HaldenWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # The camera on a locked iPhone: keeps what it takes for the app to take over.
  HaldenLockedCamera:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: LockedCamera
      - path: Shared
      - path: App/Camera
    dependencies:
      - package: HaldenKit
    info:
      path: LockedCamera/Info.plist
      properties:
        CFBundleDisplayName: Halden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
        NSCameraUsageDescription: Halden takes your photos and videos with the camera.
        NSMicrophoneUsageDescription: Halden records the sound of your videos.
        NSLocationWhenInUseUsageDescription: Halden notes where a photo was taken, how precisely, and which way the camera pointed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.halden.ios.lockedcamera
        PRODUCT_NAME: HaldenLockedCamera
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # Apple Watch camera remote (live preview via WatchConnectivity, shutter, 3 s timer, crown zoom).
  HaldenWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes: ["Info.plist"]
    dependencies:
      - package: HaldenKit
        product: HaldenWatchProtocol
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Halden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lucas.halden.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.halden.ios.watchkitapp
        PRODUCT_NAME: HaldenWatch
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  HaldenWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: HaldenWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.halden.ios.watchkitapp.uitests
        TEST_TARGET_NAME: HaldenWatch
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
  HaldenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Halden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.halden.ios.uitests
        TEST_TARGET_NAME: Halden
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Halden:
    build:
      targets:
        Halden: all
        HaldenUITests: [test]
    test:
      targets:
        - HaldenUITests
  HaldenWatch:
    build:
      targets:
        HaldenWatch: all
        HaldenWatchUITests: [test]
    test:
      targets:
        - HaldenWatchUITests
