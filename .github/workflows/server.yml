name: Server

on:
  push:
    branches: [main]
    paths: ["server/**", "packaging/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "packaging/**", ".github/workflows/server.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: server

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install ffmpeg and libheif
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libheif-examples \
            libheif-plugin-libde265 libheif-plugin-x265
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
        env:
          # Tests for thumbnails of videos and HEIC photos must really run here.
          HALDEN_REQUIRE_TOOLS: "1"
      - name: Build release
        run: cargo build --release --locked
      - name: Check the install scripts
        working-directory: packaging
        run: bash -n linux/get-halden.sh && bash -n linux/install.sh && sh -n docker/entrypoint.sh
      - name: Docker image from the built program
        working-directory: .
        run: |
          mkdir -p dist/amd64
          cp server/target/release/halden dist/amd64/halden
          docker build -f packaging/docker/Dockerfile --target release -t halden:ci .
      - name: Docker smoke test
        working-directory: .
        run: packaging/docker/smoke-test.sh halden:ci
