name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "server/src/**", "server/migrations/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "server/src/**", "server/migrations/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    # The UI tests against the real server take most of it on GitHub's slower machines.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: The server for the end-to-end tests
        working-directory: server
        run: cargo build --locked
      - name: The Xcode project matches project.yml
        working-directory: ios
        run: |
          # The same XcodeGen as on the Mac, so the generated project is byte for byte the same.
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          export PATH="/tmp/xcodegen/xcodegen/bin:$PATH"
          ./generate.sh
          git diff --exit-code -- Halden.xcodeproj
      - name: HaldenKit (with the chain against the real server)
        working-directory: ios/HaldenKit
        env:
          HALDEN_SERVER: ${{ github.workspace }}/server/target/debug/halden
        run: swift test --no-parallel
      - name: App build and UI tests in the simulator (against the real server)
        working-directory: ios
        env:
          HALDEN_SERVER: ${{ github.workspace }}/server/target/debug/halden
        run: ./ui-tests.sh
