# cargo deny check: licences, known vulnerabilities, where dependencies come from.

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported (chrono, see RUSTSEC-2026-0543) but don't fail the check;
# vulnerabilities always do.
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, but has no known vulnerability and no maintained drop-in replacement yet; revisit (jiff)" },
]

[licenses]
# Licences that are fine for an MIT project shipped as a program.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

# nom-exif's manifest has no licence field; its LICENSE file is MIT.
[[licenses.clarify]]
crate = "nom-exif"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x96600c02 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
