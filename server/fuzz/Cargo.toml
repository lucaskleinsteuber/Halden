# Fuzzing (cargo fuzz, needs the nightly toolchain): the parsers get millions of mutated inputs
# and must never crash, hang or let a path leave its folder.
#
#   cargo +nightly fuzz run range -- -max_total_time=1800
[package]
name = "halden-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
halden = { path = ".." }
minisign-verify = "0.3.0"
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false }
semver = "1"

[workspace]
members = ["."]

[[bin]]
name = "range"
path = "fuzz_targets/range.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template"
path = "fuzz_targets/template.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata"
path = "fuzz_targets/metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release"
path = "fuzz_targets/release.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing"
path = "fuzz_targets/pairing.rs"
test = false
doc = false
bench = false
