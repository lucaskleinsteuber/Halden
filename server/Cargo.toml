[package]
name = "halden"
version = "0.0.0"
edition = "2024"
description = "Halden server: self-hosted photo and video library for the Halden iPhone camera"
license = "MIT"
repository = "https://github.com/lucaskleinsteuber/Halden"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
fast_image_resize = { version = "6.2.0", features = ["image"] }
fs4 = "1.1.0"
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
mdns-sd = { version = "0.22.0", default-features = false }
minisign-verify = "0.3.0"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif"] }
nom-exif = "3.8.0"
qrcode = { version = "0.15.0", default-features = false }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "stream"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
thread-priority = "3.1.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time", "sync", "process", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.2"
toml_edit = "0.25.20"
tower-http = { version = "0.7.1", features = ["timeout", "trace", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webpki-roots = "1.0.12"
x509-parser = { version = "0.18.1", default-features = false }

# On Linux, mimalloc returns freed memory to the system quickly and avoids the fragmentation
# glibc's allocator shows in long-running, many-threaded servers. On macOS the system allocator
# measured best (see examples/loadtest.rs), so it stays.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
minisign = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Password hashing is deliberately expensive; unoptimised it makes tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Hashing gigabytes in tests and debug builds would otherwise take ages.
[profile.dev.package.sha2]
opt-level = 3
